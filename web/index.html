<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Light Agent</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --txt:#e6e8ec; --dim:#8b93a3; --acc:#5b8cff; --ok:#3ecf8e; --err:#ff6b6b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:15px/1.6 -apple-system,Segoe UI,Roboto,sans-serif;
       height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;
         align-items:center;gap:14px;flex-wrap:wrap}
  h1{font-size:17px;font-weight:600}
  .badge{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--panel2);
         color:var(--dim);border:1px solid var(--line)}
  .badge.on{color:var(--ok);border-color:#1e4a3a}
  .badge.off{color:var(--err);border-color:#4a2020}
  .spacer{flex:1}
  button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
         padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px}
  button:hover{border-color:var(--acc)}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
  main{flex:1;overflow-y:auto;padding:20px;max-width:900px;width:100%;margin:0 auto}
  .msg{margin-bottom:18px;display:flex;gap:12px}
  .msg.user{flex-direction:row-reverse}
  .av{width:32px;height:32px;border-radius:8px;flex-shrink:0;display:grid;
      place-items:center;font-size:13px;font-weight:600}
  .msg.user .av{background:var(--acc);color:#fff}
  .msg.bot .av{background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
  .bubble{background:var(--panel);border:1px solid var(--line);border-radius:12px;
          padding:12px 15px;max-width:80%;white-space:pre-wrap;word-wrap:break-word}
  .msg.user .bubble{background:var(--panel2)}
  .meta{font-size:11px;color:var(--dim);margin-top:6px}
  .steps{font-size:12px;color:var(--dim);margin-top:8px;
         padding:8px 10px;background:#12141a;border-radius:8px;border:1px solid var(--line)}
  .steps div{margin:2px 0}
  footer{border-top:1px solid var(--line);padding:14px 20px;background:var(--panel)}
  .inrow{max-width:900px;margin:0 auto;display:flex;gap:10px}
  textarea{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--txt);
           padding:11px 14px;border-radius:10px;font:inherit;resize:none;height:46px}
  textarea:focus{outline:none;border-color:var(--acc)}
  .hint{font-size:11px;color:var(--dim);margin-top:7px;text-align:center}
  code{background:#12141a;padding:1px 5px;border-radius:4px;font-size:13px}
  .welcome{color:var(--dim);text-align:center;padding:40px 0}
  .welcome h2{color:var(--txt);margin-bottom:10px;font-size:19px}
  .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
  .chip{background:var(--panel);border:1px solid var(--line);padding:8px 14px;
        border-radius:20px;font-size:13px;cursor:pointer}
  .chip:hover{border-color:var(--acc)}
</style>
</head>
<body>
<header>
  <h1>Light Agent</h1>
  <span class="badge" id="bProv">провайдеры…</span>
  <span class="badge" id="bMem">память…</span>
  <span class="badge" id="bSto">хранилище…</span>
  <span class="badge" id="bKeep">anti-sleep…</span>
  <div class="spacer"></div>
  <button onclick="resetChat()">Очистить</button>
  <button class="primary" onclick="send()">Отправить</button>
</header>

<main id="log">
  <div class="welcome">
    <h2>Лёгкий ИИ-агент</h2>
    <div>Программирование, файлы, вычисления, веб-поиск.</div>
    <div class="chips">
      <div class="chip" onclick="quick('Напиши Python-скрипт, который считает числа Фибоначчи до 10000 и сохраняет результат в файл fib.txt')">Написать скрипт</div>
      <div class="chip" onclick="quick('Покажи все файлы в рабочей папке')">Файлы</div>
      <div class="chip" onclick="quick('Найди в интернете последние новости про AI-агентов и кратко суммируй')">Поиск в интернете</div>
      <div class="chip" onclick="quick('Создай файл hello.txt с текстом приветствия и выгрузи его в облако')">Облако</div>
    </div>
  </div>
</main>

<footer>
  <div class="inrow">
    <textarea id="in" placeholder="Опиши задачу… (Enter — отправить, Shift+Enter — новая строка)" onkeydown="onKey(event)"></textarea>
    <button class="primary" onclick="send()">→</button>
  </div>
  <div class="hint">Агент выполняет задачи сам: пишет файлы, запускает код, ищет в интернете</div>
</footer>

<script>
const log = document.getElementById('log');
const input = document.getElementById('in');

function onKey(e){
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
}
function quick(t){ input.value = t; send(); }

function addMsg(text, who, meta, steps){
  if(log.querySelector('.welcome')) log.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  let h = `<div class="av">${who==='user'?'Вы':'AI'}</div><div><div class="bubble"></div>`;
  if(meta) h += `<div class="meta">${meta}</div>`;
  if(steps && steps.length){
    h += '<div class="steps">' + steps.map(s=>`<div>→ ${esc(s)}</div>`).join('') + '</div>';
  }
  h += '</div>';
  d.innerHTML = h;
  d.querySelector('.bubble').textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}
function esc(s){ return String(s).replace(/[<>&]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }

async function send(){
  const msg = input.value.trim();
  if(!msg) return;
  input.value = '';
  addMsg(msg, 'user');

  const wait = addMsg('⏳ Думаю...', 'bot');
  const t0 = Date.now();

  try{
    const res = await fetch('/api/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message: msg, session_id: 'web'})
    });
    const data = await res.json();
    const sec = ((Date.now()-t0)/1000).toFixed(1);
    wait.remove();

    if(data.ok){
      addMsg(data.answer, 'bot',
        `модель: ${data.provider} · ${sec}с · ${data.steps.length} действий`, data.steps);
    } else {
      addMsg('Ошибка: ' + (data.error || 'неизвестно'), 'bot', `${sec}с`);
    }
  }catch(e){
    wait.remove();
    addMsg('Сеть недоступна: ' + e.message, 'bot');
  }
}

async function resetChat(){
  await fetch('/api/reset', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({session_id:'web'})
  });
  log.innerHTML = '<div class="welcome"><h2>Лёгкий ИИ-агент</h2><div>История очищена</div></div>';
}

async function loadStatus(){
  try{
    const s = await (await fetch('/api/status')).json();
    setBadge('bProv', `${s.providers.length} провайдер`, s.providers.length>0);
    setBadge('bMem', s.memory.enabled?'память вкл':'память выкл', s.memory.enabled);
    setBadge('bSto', s.storage.enabled?`${s.storage.bucket}`:'хранилище выкл', s.storage.enabled);
    const a = s.anti_sleep;
    setBadge('bKeep', a.running?`anti-sleep ${a.interval_minutes}м`:'anti-sleep выкл', a.running);
  }catch(e){}
}
function setBadge(id, text, ok){
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'badge ' + (ok?'on':'off');
}
loadStatus();
setInterval(loadStatus, 30000);
</script>
</body>
</html>
