<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Light Agent</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --txt:#e6e8ec; --dim:#8b93a3; --acc:#5b8cff; --ok:#3ecf8e; --err:#ff6b6b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:15px/1.6 -apple-system,Segoe UI,Roboto,sans-serif;
       height:100vh;display:flex;flex-direction:column;overflow:hidden}
  button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
         padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit}
  button:hover{border-color:var(--acc)}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
  header{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;
         align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0}
  h1{font-size:16px;font-weight:600}
  .badge{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--panel2);
         color:var(--dim);border:1px solid var(--line);white-space:nowrap}
  .badge.on{color:var(--ok);border-color:#1e4a3a}
  .badge.off{color:var(--err);border-color:#4a2020}
  .spacer{flex:1}
  .wrap{flex:1;display:flex;overflow:hidden}
  .chat{flex:1;display:flex;flex-direction:column;overflow:hidden}
  main{flex:1;overflow-y:auto;padding:18px;max-width:820px;width:100%;margin:0 auto}
  .msg{margin-bottom:16px;display:flex;gap:11px}
  .msg.user{flex-direction:row-reverse}
  .av{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:grid;
      place-items:center;font-size:12px;font-weight:600}
  .msg.user .av{background:var(--acc);color:#fff}
  .msg.bot .av{background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
  .bubble{background:var(--panel);border:1px solid var(--line);border-radius:12px;
          padding:11px 14px;max-width:82%;white-space:pre-wrap;word-wrap:break-word}
  .msg.user .bubble{background:var(--panel2)}
  .meta{font-size:11px;color:var(--dim);margin-top:5px}
  .steps{font-size:12px;color:var(--dim);margin-top:7px;padding:7px 9px;
         background:#12141a;border-radius:8px;border:1px solid var(--line)}
  .steps div{margin:2px 0;cursor:pointer}
  .steps div:hover{color:var(--txt)}
  footer{border-top:1px solid var(--line);padding:12px 18px;background:var(--panel);flex-shrink:0}
  .inrow{max-width:820px;margin:0 auto;display:flex;gap:9px;align-items:flex-end}
  textarea{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--txt);
           padding:10px 13px;border-radius:10px;font:inherit;resize:none;
           height:46px;max-height:150px}
  textarea:focus{outline:none;border-color:var(--acc)}
  #mic{padding:11px 13px;font-size:17px;line-height:1}
  #mic.rec{background:var(--err);border-color:var(--err);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.55}}
  .hint{font-size:11px;color:var(--dim);margin-top:6px;text-align:center;max-width:820px;margin-inline:auto}
  .attachments{max-width:820px;margin:0 auto 8px;display:flex;gap:6px;flex-wrap:wrap}
  .attach{background:var(--panel2);border:1px solid var(--line);border-radius:7px;
          padding:4px 9px;font-size:12px;color:var(--dim);display:flex;gap:6px;align-items:center}
  .attach b{color:var(--txt);font-weight:500}
  .attach button{background:none;border:none;color:var(--dim);padding:0;font-size:14px;line-height:1}
  aside{width:330px;border-left:1px solid var(--line);background:var(--panel);
        display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
  aside.hidden{display:none}
  .ahead{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .ahead h2{font-size:13px;font-weight:600;flex:1}
  .ibtn{padding:4px 8px;font-size:14px;line-height:1.2}
  #tree{flex:1;overflow-y:auto;padding:8px}
  .node{font-size:13px;padding:3px 5px;border-radius:6px;cursor:pointer;
        display:flex;align-items:center;gap:6px}
  .node:hover{background:var(--panel2)}
  .node.sel{background:var(--acc);color:#fff}
  .node .sz{margin-left:auto;font-size:10px;color:var(--dim)}
  .node.sel .sz{color:#fff}
  .fbody{border-top:1px solid var(--line);max-height:45%;overflow:auto;padding:10px 14px}
  .fbody textarea{width:100%;height:180px;font:12px/1.5 Consolas,monospace;
                  background:var(--bg);color:var(--txt);border:1px solid var(--line);
                  border-radius:8px;padding:9px;resize:vertical}
  .fbody textarea:focus{outline:none;border-color:var(--acc)}
  .fmeta{font-size:11px;color:var(--dim);margin-bottom:7px;word-break:break-all}
  .frow{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
  input.pth{flex:1;min-width:100px;background:var(--bg);border:1px solid var(--line);
            color:var(--txt);padding:6px 9px;border-radius:7px;font:12px inherit}
  input.pth:focus{outline:none;border-color:var(--acc)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
         align-items:center;justify-content:center;z-index:50}
  .modal.show{display:flex}
  .mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;
        padding:20px;width:340px}
  .mbox h3{margin-bottom:12px;font-size:15px}
  .welcome{color:var(--dim);text-align:center;padding:36px 0}
  .welcome h2{color:var(--txt);margin-bottom:9px;font-size:18px}
  .chips{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:16px}
  .chip{background:var(--panel);border:1px solid var(--line);padding:7px 13px;
        border-radius:20px;font-size:13px;cursor:pointer}
  .chip:hover{border-color:var(--acc)}
  #drop{position:fixed;inset:0;background:rgba(91,140,255,.12);border:3px dashed var(--acc);
        display:none;align-items:center;justify-content:center;font-size:19px;z-index:60}
  #drop.on{display:flex}
  @media(max-width:860px){aside{position:fixed;right:0;top:0;bottom:0;z-index:40}}
</style>
</head>
<body>

<header>
  <h1>Light Agent</h1>
  <span class="badge" id="bProv">…</span>
  <span class="badge" id="bMem">…</span>
  <span class="badge" id="bSto">…</span>
  <span class="badge" id="bKeep">…</span>
  <div class="spacer"></div>
  <button onclick="toggleFiles()">Файлы</button>
  <button onclick="resetChat()">Очистить</button>
</header>

<div class="wrap">
  <div class="chat">
    <main id="log">
      <div class="welcome">
        <h2>Лёгкий ИИ-агент</h2>
        <div>Программирование, файлы, вычисления, веб-поиск.</div>
        <div class="chips">
          <div class="chip" onclick="quick('Создай проект: папку todo-app с файлами app.py, README.md и requirements.txt')">Создать проект</div>
          <div class="chip" onclick="quick('Покажи структуру проекта')">Структура</div>
          <div class="chip" onclick="quick('Напиши Python-скрипт, который считает числа Фибоначчи до 10000 и сохраняет результат в файл fib.txt')">Скрипт</div>
          <div class="chip" onclick="quick('Найди в интернете новости про ИИ-агентов и кратко суммируй')">Поиск</div>
        </div>
      </div>
    </main>

    <footer>
      <div class="attachments" id="att"></div>
      <div class="inrow">
        <textarea id="in" rows="1" placeholder="Опиши задачу, или нажмите микрофон и продиктуйте…"
                  onkeydown="onKey(event)" oninput="grow(this)"></textarea>
        <button id="mic" onclick="toggleMic()" title="Голосовой ввод">🎤</button>
        <button class="primary" onclick="send()">→</button>
      </div>
      <div class="hint">Enter — отправить · Shift+Enter — новая строка · файлы можно перетащить в окно</div>
    </footer>
  </div>

  <aside id="side" class="hidden">
    <div class="ahead">
      <h2>Файлы проекта</h2>
      <button class="ibtn" onclick="uploadPick()" title="Загрузить файл">⬆</button>
      <button class="ibtn" onclick="newFolder()" title="Новая папка">＋</button>
      <button class="ibtn" onclick="toggleFiles()" title="Закрыть">✕</button>
    </div>
    <input type="file" id="filePick" multiple style="display:none" onchange="doUpload(this.files)">
    <div id="tree"></div>
    <div class="fbody" id="fbody" style="display:none">
      <div class="fmeta" id="fmeta"></div>
      <textarea id="ftext" spellcheck="false"></textarea>
      <div class="frow">
        <button class="primary" onclick="saveFile()">Сохранить</button>
        <button onclick="downloadFile()">Скачать</button>
        <button onclick="runFile()">Запустить</button>
        <button onclick="delFile()">Удалить</button>
      </div>
    </div>
  </aside>
</div>

<div class="modal" id="modal">
  <div class="mbox">
    <h3>Новая папка</h3>
    <input class="pth" id="folderName" placeholder="имя папки" onkeydown="if(event.key==='Enter')makeFolder()">
    <div class="frow">
      <button class="primary" onclick="makeFolder()">Создать</button>
      <button onclick="closeModal()">Отмена</button>
    </div>
  </div>
</div>

<div id="drop">Отпусти файлы здесь</div>

<script>
const log=document.getElementById('log'), input=document.getElementById('in');
const attBox=document.getElementById('att'), pending=[];

function esc(s){return String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}
function grow(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,150)+'px'}
function onKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}
function quick(t){input.value=t;send()}

function addMsg(text,who,meta,steps){
  if(log.querySelector('.welcome'))log.innerHTML='';
  const d=document.createElement('div'); d.className='msg '+who;
  let h='<div class="av">'+(who==='user'?'Вы':'AI')+'</div><div><div class="bubble"></div>';
  if(meta)h+='<div class="meta">'+esc(meta)+'</div>';
  if(steps&&steps.length)h+='<div class="steps">'+steps.map(s=>'<div>→ '+esc(s)+'</div>').join('')+'</div>';
  h+='</div>';
  d.innerHTML=h;
  d.querySelector('.bubble').textContent=text;
  if(steps&&steps.length){
    d.querySelectorAll('.steps div').forEach(el=>el.onclick=()=>quick(el.textContent.replace(/^→ /,'')));
  }
  log.appendChild(d); log.scrollTop=log.scrollHeight; return d;
}

/* Голосовой ввод */
let recog=null, listening=false;
function toggleMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Браузер не поддерживает голос. Откройте страницу в Chrome или Edge.');return}
  if(listening){recog.stop();return}
  recog=new SR();
  recog.lang='ru-RU'; recog.interimResults=true; recog.continuous=false;
  recog.onstart=()=>{listening=true;document.getElementById('mic').classList.add('rec')};
  recog.onend=()=>{listening=false;document.getElementById('mic').classList.remove('rec')};
  recog.onerror=e=>{listening=false;document.getElementById('mic').classList.remove('rec');
    if(e.error!=='aborted')alert('Ошибка распознавания: '+e.error)};
  recog.onresult=e=>{
    let txt='';
    for(let i=e.resultIndex;i<e.results.length;i++)txt+=e.results[i][0].transcript;
    input.value=(input.value?input.value+' ':'')+txt; grow(input);
  };
  recog.start();
}

/* Вложения */
function renderAtt(){
  attBox.innerHTML=pending.map((f,i)=>
    '<div class="attach"><b>'+esc(f.name)+'</b><span>'+f.size+'</span>'+
    '<button onclick="pending.splice('+i+',1);renderAtt()">✕</button></div>').join('');
}
function uploadPick(){document.getElementById('filePick').click()}
async function doUpload(files){
  for(const f of files){
    const fd=new FormData(); fd.append('file',f);
    addMsg('Загружаю '+f.name+'…','bot');
    try{
      const r=await fetch('/api/upload',{method:'POST',body:fd});
      const j=await r.json();
      if(j.ok){addMsg('Файл '+j.name+' загружен ('+j.size+' Б). Агент его видит.','bot');loadTree();}
      else addMsg('Не загрузился: '+(j.detail||'?'),'bot');
    }catch(e){addMsg('Ошибка сети: '+e.message,'bot')}
  }
}

/* Отправка */
async function send(){
  const msg=input.value.trim();
  if(!msg&&!pending.length)return;
  let text=msg;
  if(pending.length)text+='\n\nПрикреплённые файлы: '+pending.map(f=>f.name).join(', ');
  input.value=''; grow(input);
  addMsg(text,'user');
  const wait=addMsg('⏳ Думаю...','bot');
  const t0=Date.now();
  try{
    const res=await fetch('/api/chat',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text,session_id:'web'})});
    const data=await res.json();
    const sec=((Date.now()-t0)/1000).toFixed(1);
    wait.remove();
    if(data.ok){
      addMsg(data.answer,'bot','модель: '+data.provider+' · '+sec+'с · '+data.steps.length+' действий',data.steps);
      if(data.steps.length)loadTree();
    } else addMsg('Ошибка: '+(data.error||'неизвестно'),'bot',sec+'с');
  }catch(e){wait.remove();addMsg('Сеть недоступна: '+e.message,'bot')}
}

async function resetChat(){
  await fetch('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({session_id:'web'})});
  log.innerHTML='<div class="welcome"><h2>Лёгкий ИИ-агент</h2><div>История очищена</div></div>';
}

/* Панель файлов */
let selPath=null;
function toggleFiles(){
  document.getElementById('side').classList.toggle('hidden');
  if(!document.getElementById('side').classList.contains('hidden'))loadTree();
}
async function loadTree(){
  const r=await fetch('/api/tree?depth=4');
  if(!r.ok)return;
  const d=await r.json(), box=document.getElementById('tree');
  if(!d.tree.length){box.innerHTML='<div style="padding:10px;color:#8b93a3;font-size:12px">Пусто. Попросите агента создать проект.</div>';return}
  box.innerHTML='';
  const walk=(items,ind)=>{
    items.forEach(it=>{
      const n=document.createElement('div');
      n.className='node'+(it.path===selPath?' sel':'');
      n.style.paddingLeft=(ind*13+5)+'px';
      const sz=it.type==='dir'?'':' <span class="sz">'+(it.size||0)+'</span>';
      n.innerHTML='<span>'+(it.type==='dir'?'📁':'📄')+'</span><span>'+esc(it.name)+'</span>'+sz;
      n.onclick=()=>{
        if(it.type==='dir'){addMsg('Покажи содержимое папки '+it.path,'user');send()}
        else openFile(it.path);
      };
      box.appendChild(n);
      if(it.children)walk(it.children,ind+1);
    });
  };
  walk(d.tree,0);
}
async function openFile(path){
  const r=await fetch('/api/file?path='+encodeURIComponent(path));
  const d=await r.json();
  selPath=path;
  document.getElementById('fbody').style.display='block';
  document.getElementById('fmeta').textContent=path;
  if(d.too_big)document.getElementById('ftext').value='(файл слишком большой)';
  else if(d.content!==undefined)document.getElementById('ftext').value=d.content;
  else document.getElementById('ftext').value='(не удалось прочитать)';
  loadTree();
}
async function saveFile(){
  if(!selPath)return;
  const r=await fetch('/api/file',{method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({path:selPath,content:document.getElementById('ftext').value})});
  const j=await r.json();
  if(j.ok)alert('Сохранено'); else alert('Ошибка: '+(j.detail||'?'));
}
function downloadFile(){if(selPath)location.href='/api/files/download?path='+encodeURIComponent(selPath)}
function runFile(){if(selPath){addMsg('Запусти файл '+selPath,'user');send()}}
async function delFile(){
  if(!selPath||!confirm('Удалить '+selPath+'?'))return;
  let r=await fetch('/api/file?path='+encodeURIComponent(selPath),{method:'DELETE'});
  if(!r.ok){
    const e=await r.json();
    if(e.detail&&e.detail.indexOf('не пустая')>=0){
      if(confirm(e.detail+' Продолжить?'))
        r=await fetch('/api/file?path='+encodeURIComponent(selPath)+'&recursive=true',{method:'DELETE'});
    }
  }
  document.getElementById('fbody').style.display='none';
  selPath=null; loadTree();
}
function newFolder(){document.getElementById('modal').classList.add('show');
  document.getElementById('folderName').value='';document.getElementById('folderName').focus()}
function closeModal(){document.getElementById('modal').classList.remove('show')}
async function makeFolder(){
  const n=document.getElementById('folderName').value.trim();
  if(!n)return;
  const r=await fetch('/api/mkdir',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({path:n})});
  const j=await r.json();
  closeModal();
  if(j.ok){addMsg('Создана папка '+j.path,'bot');loadTree()}
  else alert('Ошибка: '+(j.detail||'?'));
}

/* Перетаскивание файлов */
const dz=document.getElementById('drop');
window.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('on')});
window.addEventListener('dragleave',e=>{if(e.clientX===0&&e.clientY===0)dz.classList.remove('on')});
window.addEventListener('drop',e=>{
  e.preventDefault();dz.classList.remove('on');
  if(e.dataTransfer&&e.dataTransfer.files.length){
    if(document.getElementById('side').classList.contains('hidden'))toggleFiles();
    doUpload(e.dataTransfer.files);
  }
});

/* Статус */
async function loadStatus(){
  try{
    const s=await (await fetch('/api/status')).json();
    const badge=(id,t,ok)=>{const e=document.getElementById(id);
      e.textContent=t;e.className='badge'+(ok?' on':' off')};
    badge('bProv',s.providers.length+' провайдер',s.providers.length>0);
    badge('bMem',s.memory.enabled?'память вкл':'память выкл',s.memory.enabled);
    badge('bSto',s.storage.enabled?s.storage.bucket:'хранилище выкл',s.storage.enabled);
    badge('bKeep',s.anti_sleep.running?'anti-sleep '+s.anti_sleep.interval_minutes+'м':'anti-sleep выкл',
          s.anti_sleep.running);
  }catch(e){}
}
loadStatus(); setInterval(loadStatus,30000);
</script>
</body>
</html>
